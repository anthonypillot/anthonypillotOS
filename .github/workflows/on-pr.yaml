name: 🔍 On pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  extract:
    name: 📄 Extract version
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    uses: anthonypillot/actions/.github/workflows/extract-version.yaml@v1

  build:
    name: 🏗️ Build
    uses: anthonypillot/actions/.github/workflows/node-build-and-test.yaml@v1
    with:
      node_version: '["24"]'
      run_test: true
      run_test_command: "test -- --run"
      run_lint: true

  push:
    name: 🐳 Push
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && needs.extract.outputs.result != 'latest' }}
    needs: [extract, build]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: ⚙️ Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: 🛠 Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 📲 Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/os
          flavor: latest=false
          tags: type=raw,value=${{ needs.extract.outputs.result }}
          labels: |
            org.opencontainers.image.version=${{ needs.extract.outputs.result }}

      - name: 🐳 Build and push image
        uses: docker/build-push-action@v7
        timeout-minutes: 20
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
